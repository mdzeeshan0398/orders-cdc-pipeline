services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: etl
      POSTGRES_PASSWORD: etl
      POSTGRES_DB: etl
      PGPASSWORD: etl
    ports: ["5432:5432"]
    volumes:
      - ./sql:/sql:ro
      - ./sql/00_init.sh:/docker-entrypoint-initdb.d/00_init.sh:ro
    healthcheck:
      # TCP + a real query, so it only passes after the init scripts have finished
      test: ["CMD-SHELL", "psql -h localhost -U etl -d warehouse -c 'SELECT 1 FROM dw.etl_watermark' > /dev/null"]
      interval: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.7.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  producer:
    image: python:3.11-slim
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_started}
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      SOURCE_DSN: dbname=shop user=etl password=etl host=postgres
      EVENTS_PER_SEC: "5"
    volumes: [".:/opt/project:ro"]
    command: >
      sh -c "pip install -q -r /opt/project/requirements-producer.txt &&
             python /opt/project/producer/order_producer.py"
    restart: on-failure

  spark-stream:
    build: ./spark
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_started}
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      WAREHOUSE_JDBC: jdbc:postgresql://postgres:5432/warehouse
      WAREHOUSE_DSN: dbname=warehouse user=etl password=etl host=postgres
      PYTHONPATH: /opt/project
    volumes: [".:/opt/project:ro"]
    command: >
      /opt/spark/bin/spark-submit
      --conf spark.jars.ivy=/tmp/.ivy2
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.1,org.postgresql:postgresql:42.7.3
      /opt/project/pipeline/spark_stream.py
    restart: on-failure

  airflow:
    image: apache/airflow:2.9.3-python3.11
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW_CONN_SHOP_SOURCE: postgresql://etl:etl@postgres:5432/shop
      AIRFLOW_CONN_WAREHOUSE: postgresql://etl:etl@postgres:5432/warehouse
    ports: ["8080:8080"]
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      - .:/opt/project:ro
    command: standalone
